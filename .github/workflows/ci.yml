name: ALOE Protocol-v1 CI & Offline Audit Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch + ALOE + BoTorch + Dev Suite
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[bo,dev]"

      - name: Verify Zero-Dependency Stdlib Split Verifier
        run: |
          python scripts/verify_campaign.py --manifest data/manifests/xlam_ipd_v1.json

      - name: Run Full Pytest Suite with JUnit & Coverage Receipts
        run: |
          mkdir -p receipts/ci
          pytest tests/ -q \
            --junitxml=receipts/ci/junit.xml \
            --cov=aloe \
            --cov-report=term-missing \
            --cov-report=xml:receipts/ci/coverage.xml

      - name: Upload CI Verification Receipts
        uses: actions/upload-artifact@v4
        with:
          name: aloe-ci-receipts
          path: receipts/ci/
