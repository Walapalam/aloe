[project]
name = "aloe"
version = "0.1.0"
description = "ALOE — Architecture-Typed, Multi-Objective LoRA Optimisation for Local Agentic Tool Use"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.44",
  "datasets>=2.20",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
cuda = ["peft>=0.12", "bitsandbytes>=0.43", "accelerate>=0.33"]
mlx  = ["mlx>=0.18", "mlx-lm>=0.18"]
bo   = ["botorch>=0.11", "gpytorch>=1.13"]
dev  = ["pytest>=8.0", "pytest-cov", "ruff>=0.6"]

[project.scripts]
aloe = "aloe.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aloe*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
