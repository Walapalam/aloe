[project]
name = "aloe"
version = "0.2.0"
description = "ALOE — Architecture-Typed, Multi-Objective LoRA Optimisation for Local Agentic Tool Use"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "transformers>=4.46",
  "peft>=0.13",
  "accelerate>=1.0",
  "datasets>=3.0",
  "huggingface-hub>=0.25",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
cuda = ["bitsandbytes>=0.43"]
mlx  = ["mlx>=0.18", "mlx-lm>=0.18"]
bo   = ["botorch>=0.12", "gpytorch>=1.13"]
dev  = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "openpyxl>=3.1"]

[project.scripts]
aloe = "aloe.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aloe*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
